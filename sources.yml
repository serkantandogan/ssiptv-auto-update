# Add only authorized sources here.
# Supported source types:
# - url: a remote M3U/M3U8 playlist URL
# - file: a local M3U file committed to this repo

sources:
  - name: IPTV-org Turkey public channels
    enabled: true
    category: Turkey
    url: https://iptv-org.github.io/iptv/countries/tr.m3u

  # Optional: the worldwide public playlist is very large.
  # Enable it only if you want an 11000+ channel global list.
  - name: IPTV-org worldwide public channels
    enabled: false
    category: Worldwide
    url: https://iptv-org.github.io/iptv/index.m3u

  - name: Example local playlist
    enabled: false
    category: Test
    file: examples/example.m3u

# false means: include every validated channel from enabled public sources.
# The selected_channels list below is kept for optional curated-only mode.
selected_only: false

# Keep suspicious premium/pay-TV looking entries out of the automatic public list.
exclude_keywords:
  - beIN
  - S Sport
  - MovieSmart
  - National Geographic
  - Viasat
  - BBC Earth
  - BBC First
  - BabyTV
  - Disney Jr

category_order:
  - Favori Listem
  - Ulusal
  - Haber
  - Ekonomi
  - Belgesel
  - Çocuk
  - Spor
  - Müzik
  - Kültür
  - Eğitim
  - Dini
  - Yerel
  - Eğlence
  - Yaşam
  - Film
  - Genel

# Channels whose official site exposes a public HLS URL in the page.
# The updater extracts a fresh URL on every run.
dynamic_channels:
  - name: Show TV
    source: Show TV official live page
    category: Ulusal
    page_url: https://www.showtv.com.tr/canli-yayin
    url_pattern: 'var videoUrl = "([^"]+)"'
    attrs:
      tvg-id: ShowTV.tr@SD
      tvg-name: Show TV
      tvg-logo: https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Show_TV.svg/512px-Show_TV.svg.png

# Duplicate these channels into a top-level favorites group.
favorite_channels:
  category: Favori Listem
  channels:
    - name: TRT 1
      match:
        - TRT 1
        - TRT1.tr
    - name: NOW TV
      match:
        - NOW TV
        - NOWTV.tr
    - name: Star TV
      match:
        - Star TV
        - StarTV.tr
    - name: Kanal D
      match:
        - Kanal D
        - KanalD.tr
    - name: Show TV
      match:
        - Show TV
        - ShowTV.tr
    - name: Halk TV
      match:
        - Halk TV
        - HalkTV.tr
    - name: Sözcü TV
      match:
        - Sözcü TV
        - Sozcu TV
        - SZC TV
        - SozcuTV.tr
    - name: TV8
      match:
        - TV 8
        - TV8.tr
    - name: Tele1
      match:
        - Tele 1
        - Tele1.tr
    - name: CNBC-e
