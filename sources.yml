# Add only authorized sources here.
# Supported source types:
# - url: a remote M3U/M3U8 playlist URL
# - file: a local M3U file committed to this repo

sources:
  - name: IPTV-org Turkey public channels
    enabled: true
    category: Turkey
    url: https://iptv-org.github.io/iptv/countries/tr.m3u

  # Optional: the worldwide public playlist is very large.
  # Enable it only if you want an 11000+ channel global list.
  - name: IPTV-org worldwide public channels
    enabled: false
    category: Worldwide
    url: https://iptv-org.github.io/iptv/index.m3u

  - name: Example local playlist
    enabled: false
    category: Test
    file: examples/example.m3u

# Channels whose official site exposes a public HLS URL in the page.
# The updater extracts a fresh URL on every run.
dynamic_channels:
  - name: Show TV
    source: Show TV official live page
    category: Ulusal
    page_url: https://www.showtv.com.tr/canli-yayin
    url_pattern: 'var videoUrl = "([^"]+)"'
    attrs:
      tvg-id: ShowTV.tr@SD
      tvg-name: Show TV
      tvg-logo: https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Show_TV.svg/512px-Show_TV.svg.png

# Keep only these channels and write them in this order.
# Matching is done against channel name and tvg-id from the authorized sources above.
selected_channels:
  - name: TRT 1
    category: Ulusal
    match:
      - TRT 1
      - TRT1.tr
  - name: NOW TV
    category: Ulusal
    match:
      - NOW TV
      - NOWTV.tr
  - name: Star TV
    category: Ulusal
    match:
      - Star TV
      - StarTV.tr
  - name: Kanal D
    category: Ulusal
    match:
      - Kanal D
      - KanalD.tr
  - name: Show TV
    category: Ulusal
    match:
      - Show TV
      - ShowTV.tr
  - name: Halk TV
    category: Haber
    match:
      - Halk TV
      - HalkTV.tr
  - name: Sözcü TV
    category: Haber
    match:
      - Sözcü TV
      - Sozcu TV
      - SZC TV
      - SozcuTV.tr
  - name: TV8
    category: Ulusal
    match:
      - TV 8
      - TV8.tr
  - name: Tele1
    category: Haber
    match:
      - Tele 1
      - Tele1.tr
  - name: CNBC-e
    category: Haber
    match:
      - CNBC-e
      - CNBCe.tr

# Optional channel name rules.
# These help normalize categories when the source playlist has no group-title.
category_rules:
  News:
    - news
    - haber
  Sports:
    - sport
    - spor
  Kids:
    - kids
    - çocuk
    - cocuk
  Movies:
    - movie
    - film
    - sinema
  Music:
    - music
    - müzik
    - muzik

validation:
  timeout_seconds: 5
  max_workers: 16
  user_agent: "SSIPTV-Auto-Update/1.0"
  # HEAD is faster, but some IPTV hosts reject it. The script falls back to GET.
  verify_tls: true
